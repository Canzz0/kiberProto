syntax = "proto3";

package analyc.v1;

service AnalyticService {
  rpc AnalyzeUser (AnalyzeUserRequest) returns (AnalyzeUserResponse);
}

message AnalyzeUserRequest {
  int32 user_id = 1;
}

message SourceResult {
  string source = 1;   // google | holidaycheck | expedia | tripadvisor | booking | zoover
  string method = 2;   // api | bot
  string status = 3;   // completed | failed | skipped
  int32 collected = 4; // toplanan yorum sayisi
  string message = 5;  // bilgi / hata mesaji
}

message AnalyzeUserResponse {
  int32 user_id = 1;
  string status = 2;   // completed | failed | no_active_source | not_found
  repeated SourceResult results = 3;
}
