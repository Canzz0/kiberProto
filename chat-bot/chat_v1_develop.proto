syntax = "proto3";

package chat.v1;

service ChatService {
  rpc Guess (GuessRequest) returns (GuessResponse);
  // NPM raporlama: otel yoneticisinin serbest metin sorusu.
  rpc ReportQuery (ReportQueryRequest) returns (ReportQueryResponse);
  // NPM raporlama DUZENLEME MODU: kayitli bir raporun SQL'ini kucuk bir
  // degisiklik talebiyle guncelleyip yeniden calistirir. Sema/kural seti
  // AI'ye tekrar gonderilmedigi icin token maliyeti dusuktur.
  rpc ReviseReportQuery (ReviseReportQueryRequest) returns (ReportQueryResponse);
}

message ReviseReportQueryRequest {
  // Daha once uretilmis ve kaydedilmis SELECT sorgusu.
  string priorSql = 1;
  // Kullanicinin kucuk degisiklik talebi, orn. "temmuz icin yap".
  string changeRequest = 2;
}

message ReportQueryRequest {
  string question = 1;
  // Onceki konusma, GuessRequest.chatHistory ile AYNI format: JSON string
  // olarak serilestirilmis [{ role, parts: [{ text }] }] dizisi.
  // Gecmis istegin icinde tasinir (backend saklamaz). chat-bot yalnizca son
  // 5 mesaji dikkate alir; fazlasi gonderilse de kirpilir.
  string chatHistory = 2;
}

message ReportQueryResponse {
  // Kullanicinin sordugu soru (echo).
  string question = 1;
  // Gemini'nin o soruya ozel urettigi SELECT sorgusu.
  string generatedSql = 2;
  // Sonuc satirlari JSON dizisi olarak. Satir semasi sorguya gore degistigi
  // icin proto mesaji yerine JSON string tasinir; gateway bunu parse edip
  // HTTP cevabinda gercek dizi olarak verir. Hata durumunda "[]".
  string rowsJson = 3;
  int32 rowCount = 4;
  // Yalnizca sorgu calistirilamadiginda dolu olur.
  string note = 5;
  // Sorgunun calisma suresi (ms). Basarisizsa 0.
  int32 durationMs = 6;

  // SQL uretimi sirasindaki Gemini token kullanimi.
  // proto3'te int32 null olamaz (yokken 0 doner), bu yuzden varligi
  // `hasTokenUsage` ile tasinir: false ise gateway bu ucunu null dondurur.
  int32 totalTokens = 7;
  int32 inputTokens = 8;
  int32 outputTokens = 9;
  bool hasTokenUsage = 10;

  // Sonucun insan diliyle 1-2 cumlelik ozeti. Gercek satirlara bakilarak
  // uretilir. Uretilemezse bos olabilir.
  string summary = 11;
  // Frontend'e gorsellestirme onerisi.
  ReportView view = 12;
}

message ReportViewColumn {
  // Sonuc satirlarindaki alan/alias adi.
  string field = 1;
  // Insan diline uygun baslik (sabit sozlukten doldurulur).
  string label = 2;
}

message ReportView {
  // "bar" | "pie" | "line" | "table"
  string type = 1;
  // bar/pie/line icin dolu; table icin bos.
  string xField = 2;
  // Geriye donuk uyumluluk: yFields'in ilk elemani. Yeni istemciler
  // yFields'i kullanmalidir.
  string yField = 3;
  string title = 4;
  // Yalnizca type == "table" oldugunda dolu.
  repeated ReportViewColumn columns = 5;
  // Cok serili grafikler icin tum y-alanlari (orn. yila gore ayri sutunlar).
  // Tek seri durumunda tek elemanlidir.
  repeated string yFields = 6;
}

service TranslateService {
  rpc Translate (TranslateRequest) returns (TranslateResponse);
}

message TranslateRequest {
  string text = 1;
  string targetLang = 2;
}

message TranslateResponse {
  string translatedText = 1;
  string originalLang = 2;
}

message GuessRequest {
  string departmanlar = 1;
  string konumlar = 2;
  string turler = 3;
  string altturler = 4;
  string chatHistory = 5;
  string guid = 6;
  string category = 7;
  string message = 8;
  // production=false iken gateway'in gönderdiği prompt/tool override paketi
  string aiOverrides = 9;
    string checkin = 11;
  string checkout = 12;
}

// Nested message structure reflecting the described apiResponse JSON
message ApiResponse {
  string description = 1;
  string language = 2;
  int32 department = 3;
  int32 location = 4;
  int32 altturler = 5;
  int32 turler = 6;
  int32 category = 7;
  string messageType = 8;
  string response = 9;
  int32 roomNumber = 10;
  string checkin = 11;
  string checkout = 12;
}

message GuessResponse {
  // The envelope object "message" can be represented by the root GuessResponse itself.
  ApiResponse apiResponse = 1;
  int32 totalTokens = 2;
  int32 inputTokens = 3;
  int32 outputTokens = 4;
}
