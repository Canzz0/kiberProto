syntax = "proto3";

package chat.v1;

service ChatService {
  rpc Guess (GuessRequest) returns (GuessResponse);
  rpc ReportQuery (ReportQueryRequest) returns (ReportQueryResponse);
}

service TranslateService {
  rpc Translate (TranslateRequest) returns (TranslateResponse);
}

message TranslateRequest {
  string text = 1;
  string targetLang = 2;
}

message TranslateResponse {
  string translatedText = 1;
  string originalLang = 2;
}

message GuessRequest {
  string departmanlar = 1;
  string konumlar = 2;
  string turler = 3;
  string altturler = 4;
  string chatHistory = 5;
  string guid = 6;
  string category = 7;
  string message = 8;
  // production=false iken gateway'in gönderdiği prompt/tool override paketi
  string aiOverrides = 9;
    string checkin = 11;
  string checkout = 12;
}

// Nested message structure reflecting the described apiResponse JSON
message ApiResponse {
  string description = 1;
  string language = 2;
  int32 department = 3;
  int32 location = 4;
  int32 altturler = 5;
  int32 turler = 6;
  int32 category = 7;
  string messageType = 8;
  string response = 9;
  int32 roomNumber = 10;
  string checkin = 11;
  string checkout = 12;
}

message GuessResponse {
  // The envelope object "message" can be represented by the root GuessResponse itself.
  ApiResponse apiResponse = 1;
  int32 totalTokens = 2;
  int32 inputTokens = 3;
  int32 outputTokens = 4;
}

// NPM raporlama — serbest metin soru -> SQL + sonuc ozeti
message ReportQueryRequest {
  string question = 1;
}

message ReportViewColumn {
  string field = 1;
  string label = 2;
}

message ReportView {
  string type = 1; // bar | pie | line | table
  string xField = 2;
  string yField = 3;
  repeated string yFields = 4;
  string title = 5;
  repeated ReportViewColumn columns = 6;
}

message ReportQueryResponse {
  string question = 1;
  string generatedSql = 2;
  string rowsJson = 3;
  int32 rowCount = 4;
  string note = 5;
  int32 durationMs = 6;
  int32 totalTokens = 7;
  int32 inputTokens = 8;
  int32 outputTokens = 9;
  bool hasTokenUsage = 10;
  string summary = 11;
  ReportView view = 12;
}
